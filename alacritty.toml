draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#686868"
blue = "#95e6cb"
cyan = "#95e6cb"
green = "#c2d94c"
magenta = "#ffee99"
red = "#f07178"
white = "#ffffff"
yellow = "#ffb454"

[colors.cursor]
cursor = "#ff4057"
text = "#080c11"

[colors.normal]
black = "#01060e"
blue = "#95e6cb"
cyan = "#90e1c6"
green = "#91b362"
magenta = "#fae994"
red = "#ea6c73"
white = "#c7c7c7"
yellow = "#f9af4f"

[colors.primary]
background = "#080c11"
foreground = "#dadbc0"

[colors.selection]
background = "#3d424d"
text = "#dadbc0"

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.bold]
family = "D2CodingLigature Nerd Font"
style = "Bold"

[font.bold_italic]
family = "D2CodingLigature Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "D2CodingLigature Nerd Font"
style = "Italic"

[font.normal]
family = "D2CodingLigature Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 1

[window]
title = "Alacritty"
dynamic_title = true
resize_increments = false

[[keyboard.bindings]]
key = "Escape"
mods = "Control|Shift"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[window.padding]
x = 0
y = 0
